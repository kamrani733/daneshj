  /notification/actor-notifications/list:
    get:
      operationId: notification_actor_notifications_list_retrieve
      description: "\n        Last Version Update: 1.0.0\n\n\n        SRS Codes:\n\n
        \       نمایش تاریخچه اعلانات \n        ASR-Ntf-1N2\n        USR-Ntf-1N2\n
        \       Adm-Ntf-1N2\n\n        فیلتر گذاری اعلانات\n        ASR-Ntf-1N3\n
        \       USR-Ntf-1N3\n        Adm-Ntf-1N3\n\n        جستجو در تاریخچه اعلانات\n
        \       ASR-Ntf-1N4\n        USR-Ntf-1N4\n        Adm-Ntf-1N4\n\n        مرتب‌سازی
        تاریخچه اعلانات\n        ASR-Ntf-1N5\n        USR-Ntf-1N5\n        Adm-Ntf-1N5\n\n\n\n
        \       Change Log:\n        []\n\n\n        Description of endpoint: this
        endpoint shows the last 5 notifications of actor with\n        search,sort,pagination
        ability.\n\n        "
      summary: Display all  notifications of actor
      parameters:
      - in: query
        name: end_date
        schema:
          type: string
        description: 'End date for the time range . Format: YYYY-MM-DD'
      - in: query
        name: is_read
        schema:
          type: string
          enum:
          - 'false'
          - 'true'
        description: Filter by read status. Use 'true' for Read, 'false' for Unread.
          Leave empty for 'All'.
      - in: query
        name: main_category_id
        schema:
          type: integer
        description: ID of the Parent Category (Primary Category). Only works for
          'system' type.
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - -created_at
          - -is_read
          - created_at
          - is_read
        description: 'Sort results: ''is_read'' (Unread first), ''-is_read'' (Read
          first), ''-created_at'' (Newest first).'
      - in: query
        name: page
        schema:
          type: integer
          default: 1
        description: Page number
        required: true
      - in: query
        name: search
        schema:
          type: string
        description: Search keyword in subject or content.
      - in: query
        name: start_date
        schema:
          type: string
        description: 'Start date for the time range. Format: YYYY-MM-DD.'
      - in: query
        name: sub_category_id
        schema:
          type: integer
        description: ID of the Child Category (Sub-category).
      - in: query
        name: type
        schema:
          type: string
          enum:
          - manual
          - system
        description: 'Filter by notification type: ''manual'' (Manual) or ''system''
          (System).'
      tags:
      - 'All Actor: Notifications - Code: Ntf_1'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorNotificationListResponse'
              examples:
                ListOfActorNotifications:
                  value:
                    data:
                      count: 5
                      total_pages: 1
                      current_page: 1
                      next: null
                      previous: null
                      results:
                      - id: 491
                        subject: null
                        main_category: حساب کاربری
                        sub_category: بازیابی رمز عبور
                        is_read: true
                        sent_at: '1405-02-03 17:25:53'
