openapi: 3.0.3
info:
  title: InteractiveoperationsMS Microservice API
  version: 1.0.0
  description: "\n\n    \n### Change Log: \n\n### \U0001F4C5 Date Of Update: 1405/05/19\n**Version:**
    1.0.0  \n**List of New Endpoints:**  \n- `/app_name/test_api`\n- `/interactive-ops/follow`\n-
    `/interactive-ops/follow/followers` \n- `/interactive-ops/follow/followings` \n-
    `/interactive-ops/like`\n- `/interactive-ops/like/likers`\n- `/interactive-ops/like/likees`\n-
    `/interactive-ops/like/dislikers`\n- `/interactive-ops/like/dislikees`\n- `/interactive-ops/share`\n-
    `/interactive-ops/score`\n- `/interactive-ops/score/average`                                    \n\n\n\n---\n\n###
    \U0001F4C5 Date Of Update: 1404/../.. \n**Version:** 1.0.0  \n**List of Changed
    Endpoints:**  \n- `/..../.......`  \n\n---\n\n\n\n    "
paths:
  /core/ino_test_token/:
    get:
      operationId: core_ino_test_token_retrieve
      description: "\n        Test token\n        "
      summary: test token
      tags:
      - 'All Actor: Test Token'
      responses:
        '200':
          description: No response body
      security:
      - UserBearerAuth: []
      - AdminBearerAuth: []
      - UniversityBearerAuth: []
      - IndustryBearerAuth: []
      - BusinessBearerAuth: []
  /interactive-ops/follow:
    post:
      operationId: interactive_ops_follow_create
      description: "\n           Last Version Update: 1.0.0\n\n           SRS Codes:
        \n           دنبال کردن توسط کاربر یا سرویس دهنده\n           Usr-Ino-2N1,
        Asr-Ino-2N1, Usr-Ino-2N2, Asr-Ino-2N2\n\n           Change Log:\n           [Explanation
        about endpoint changes in endpoint]\n\n           Description of endpoint:\n
        \          \"Get actor_id, actor_type, target_id, target_type و is_active
        from user/service provider.\"\n           \"If there is no record, create
        new record. else, is_active will be updated.\"\n           "
      summary: Follow/Unfollow user/industry/university/business/service/product by
        actor
      tags:
      - 'All actor: Follow/unfollow an entitiy - Code: 1-53-1'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FollowRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FollowRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FollowRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameResponse'
              examples:
                CorrectFollowExample:
                  value:
                    data:
                      actor_type: 1
                      actor_id: 1
                      target_type: 2
                      target_id: 2
                      is_active: true
                    message: user with user id 1 followed business with id 2 successfully.
                    status_code: 200
                    errors: {}
                    success: true
                  summary: Correct follow Example
                CorrectUnfollowExample:
                  value:
                    data:
                      actor_type: 1
                      actor_id: 1
                      target_type: 6
                      target_id: 3
                      is_active: false
                    message: user with id 1 unfollowed service with id 3 successfully.
                    status_code: 200
                    errors: {}
                    success: true
                  summary: Correct unfollow Example
          description: Example of follow and unfollow
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
              examples:
                BadRequestExample:
                  value:
                    data: null
                    message: null
                    status_code: 400
                    errors:
                      name: string
                    success: false
                  summary: Bad request example
          description: Bad request example
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
              examples:
                InternalServerErrorExample:
                  value:
                    data: null
                    message: Internal server error
                    status_code: 500
                    errors: {}
                    success: false
                  summary: Internal Server Error Example
          description: Internal server error response body
      security: null
  /interactive-ops/follow/followers:
    get:
      operationId: interactive_ops_follow_followers_retrieve
      description: "\n        Last Version Update: 1.0.0\n\n        SRS Codes: \n
