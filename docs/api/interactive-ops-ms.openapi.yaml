                      actor_type: 1
                      actor_id: 1
                      target_type: 7
                      target_id: 2
                      status: 1
                    message: user with id 1 liked comment with id 2 successfully
                    status_code: 200
                    errors: {}
                    success: true
                  summary: Create or update request to create like Example
