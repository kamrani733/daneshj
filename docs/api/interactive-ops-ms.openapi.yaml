                      actor_type: 1
                      actor_id: 1
                      target_type: 3
                      target_id: 4
                      status: 2
                    message: user with id 1 updated his reaction to industry with
                      id 4 to 'None' successfully
                    status_code: 200
                    errors: {}
                    success: true
                  summary: Update request to remove reaction Example
          description: Example for create Like/Dislike or remove reaction on target
        '400':
          content:
            application/json:
