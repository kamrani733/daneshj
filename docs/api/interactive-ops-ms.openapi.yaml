        Asr-Ino-1N1, Adm-Ino-1N1\n\n        Change Log:\n        [Explanation about
        endpoint changes in endpoint]\n\n        Description of endpoint:\n        \"Get
        target_id, target_type from user/service provider/admin. \"\n        \"api
        returns list of followers of entity.\"\n        "
      summary: Get followers list of user/industry/university/business/service/product
        by actor
      parameters:
      - in: query
        name: target_id
        schema:
          type: integer
        description: target's ID
        required: true
      - in: query
        name: target_type
        schema:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
          - 6
        required: true
      tags:
      - 'All actor: Follow List - Code: 1-53-1'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NameResponse'
              examples:
                FetchListOfFollowersOfEntityExample:
                  value:
                    data:
                      target_type: 1
                      target_id: 2
                    message: User with id 2 has 100 followers.
                    status_code: 200
                    errors: {}
                    success: true
                  summary: Fetch list of followers of entity Example
          description: Example to fetch List of followers.
        '400':
          content:
            application/json:
              schema:
