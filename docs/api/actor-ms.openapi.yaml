    put:
      operationId: profiles_base_cooperation_request_approve_update
      description: "\n        Last Version Update: 1.0.0\n\n\n        SRS Codes:\n
        \       تایید درخواست همکاری سرویس‌دهنده حقوقی \n        Adm-Prf-4N4\n        تایید
        درخواست همکاری سرویس‌‌دهنده انفرادی\n        Adm-Prf-4N5\n\n\n\n\n        Change
        Log:\n        [Explanation about endpoint changes in endpoint]\n\n\n        Description
        of endpoint:\n        Approval Cooperation Request\n        \n        actor_type=['Individual',
        'University', 'Industry', 'Business']\n        \n        \n        Note: \n
        \       - for guest_user(individual), submit coop_req without OurUser_obj
        and temporary our_individual_profile\n        - پس از تایید درخواست همکاری،
        به صورت خودکار یا با فعال‌سازی از پنل خصوصی (بسته به تنظیمات)، برای سرویس
        دهنده پنل عمومی ایجاد می شود.\n\n        "
      summary: Approval Cooperation Request
      tags:
      - 'Admin: Cooperation Request Review - Code: Prf-4'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CooperationRequestReviewRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CooperationRequestReviewRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CooperationRequestReviewRequest'
        required: true
      responses:
