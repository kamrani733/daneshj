          description: No response body
      security:
      - AdminBearerAuth: []
  /profiles_base/cooperation/request/confirm-guest:
    put:
      operationId: profiles_base_cooperation_request_confirm_guest_update
      description: "\n        Last Version Update: 1.0.0\n\n\n        SRS Codes:\n
        \       انتقال اطلاعات همکاری کاربر میهمان به پروفایل کاربر ثبت‌نام شده\n
        \       Adm-Prf-4N10\n        خطای عدم ثبت‌نام کاربر حین انتقال اطلاعات همکاری\n
        \       Adm-Prf-4E2     \n        خطای شناسه درخواست حین انتقال اطلاعات همکاری\n
        \       Adm-Prf-4E3\n        خطای انتقال اطلاعات همکاری سرویس‌دهنده فعال\n
        \       Adm-Prf-4E4\n\n        \n        \n        ...........\n        از
        قبل باید درخواست همکاری توسط راهبر تایید شده باشد و همچنین کاربر ثبت نام هم
        کرده باشد\n        انتقال اطلاعات درخواست فرم همکاری کاربر مهمان به پروفایل،
        \ پس از ثبت نام به عنوان کاربر عادی\n        سپس سیستم به صورت خودکار وضعیت
        سرویس دهنده انفرادی را برای آن کاربر فعال میکند\n\n\n        Change Log:\n
        \       [Explanation about endpoint changes in endpoint]\n\n\n        Description
        of endpoint:\n        Confirm Guest_User(individual) Cooperation Request\n
        \       \n        \n        Note:\n        - پس از تایید درخواست همکاری، به
        صورت خودکار یا با فعال‌سازی از پنل خصوصی (بسته به تنظیمات)، برای سرویس دهنده
        پنل عمومی ایجاد می شود.\n\n\n        "
      summary: Confirm Guest_User(individual) Cooperation Request
      tags:
      - 'Admin: Cooperation Request Review - Code: Prf-4'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmGuestCooperationRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ConfirmGuestCooperationRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ConfirmGuestCooperationRequestRequest'
        required: true
