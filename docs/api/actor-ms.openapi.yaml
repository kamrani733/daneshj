        \       -Existing records are updated according to the editable field configuration.\n\n
        \       One-to-Many sections:\n        -If id = 0:\n          -If the section
        is configured as EXCLUSIVE_CREATE_RECORD, the record is created immediately
        in the main table.\n          -Otherwise, a CreateRecordRequest is created.
        The record will be inserted into the main table only after approval.\n        -If
        id > 0:\n          -Submitted field values are processed according to the
        editable field configuration.\n\n        Editable field behavior:\n        -Fields
        configured in EXCLUSIVE_EDITABLE_FIELDS are updated immediately without creating
        a review request.\n        -All other editable fields are stored as pending
        field change requests and require approval before being applied.\n\n        Review
        process:\n        -Approved CreateRecordRequest records are inserted into
        the main table.\n        -Approved field change requests update the corresponding
        fields of existing records.\n        -Rejected requests are discarded without
        affecting the current data.\n\n\n\n\n        ** Note **:\n        - In the
        editing endpoint, when an actor changes their picture on the frontend, the
        preview of the\n          image is handled entirely on the client side, and
        at this stage, there is no need to store the image on the\n          backend
        or in services like Cloudflare.\n          However, once the actor clicks
        the \"Confirm\" button after applying all changes, it indicates that they
        want all\n          the modifications—including the new picture—to be saved
        permanently. Therefore, before sending the\n          final request to the
        editing endpoint, the frontend must first upload the selected image to Cloudflare\n
        \         (or any file storage service) via a separate endpoint. Then, the
        final URL of the uploaded image should be\n          included in the picture_path
        field of the request body sent to the editing endpoint.\n\n\n\n        TAB_CONFIG={'identity_information':
        {'section_names': ['identity_info_user', 'identity_info_user_translation'],
        'parent_sections': {}}, 'social_information': {'section_names': ['social_info_user',
        'social_info_user_translation', 'social_info_user_division_code'], 'parent_sections':
        {}}, 'contact_information': {'section_names': ['contact_info_user'], 'parent_sections':
        {}}, 'user_information': {'section_names': ['our_user', 'membership_type_user'],
        'parent_sections': {}}, 'educational_information': {'section_names': ['education_occupation_info_user',
        'education_occupation_info_user_division_code', 'academic_record_submitted_user',
        'academic_record_submitted_user_translation', 'academic_record_verified_user',
        'academic_record_verified_user_translation', 'academic_document_user', 'academic_document_user_translation'],
        'parent_sections': {}}}\n\n\n        "
      summary: Submit Private Panel change request by owner
      parameters:
      - in: query
        name: tab_name
        schema:
          type: string
          enum:
          - contact_information
          - educational_information
          - identity_information
