        \       تکمیل/ ویرایش پنل خصوصی کاربر توسط راهبر\n        Adm-Prf-2N3\n\n\n\n
        \       Change Log:\n        [Explanation about endpoint changes in endpoint]\n\n\n
        \       Description of endpoint:\n        -This endpoint handles both record
        creation and record updates.\n        -Depending on the section and field
        configuration, submitted changes are either applied immediately or stored
        for review.\n\n        Behavior:\n        One-to-One sections:\n        -If
        the target record does not exist:\n          -An initial record is created
        in the main table.\n          -Submitted field values are processed according
        to the editable field configuration.\n        -Existing records are updated
        according to the editable field configuration.\n\n        One-to-Many sections:\n
        \       -If id = 0:\n          -If the section is configured as EXCLUSIVE_CREATE_RECORD,
        the record is created immediately in the main table.\n          -Otherwise,
        a CreateRecordRequest is created. The record will be inserted into the main
        table only after approval.\n        -If id > 0:\n          -Submitted field
        values are processed according to the editable field configuration.\n\n        Editable
        field behavior:\n        -Fields configured in EXCLUSIVE_EDITABLE_FIELDS are
        updated immediately without creating a review request.\n        -All other
        editable fields are stored as pending field change requests and require approval
        before being applied.\n\n        Review process:\n        -Approved CreateRecordRequest
        records are inserted into the main table.\n        -Approved field change
        requests update the corresponding fields of existing records.\n        -Rejected
        requests are discarded without affecting the current data.\n\n\n\n        TAB_CONFIG={'identity_information':
        {'section_names': ['identity_info_user', 'identity_info_user_translation'],
        'parent_sections': {}}, 'social_information': {'section_names': ['social_info_user',
        'social_info_user_translation', 'social_info_user_division_code'], 'parent_sections':
