        'academic_record_submitted_user_translation', 'academic_record_verified_user',
        'academic_record_verified_user_translation', 'academic_document_user', 'academic_document_user_translation'],
        'parent_sections': {}}}\n\n        "
      summary: Submit Private Panel change request by admin
      parameters:
      - in: query
        name: actor_id
        schema:
          type: integer
        required: true
      - in: query
        name: tab_name
        schema:
          type: string
          enum:
