  /auth/block_actor:
    post:
      operationId: auth_block_actor_create
      description: "\n        Last Version Update: 1.0.0\n\n\n        SRS Codes:\n\
        \        مسدودي / رفع مسدودي عملگر\n        Adm-Aut-7N1\n\n\n        Change\
        \ Log:\n        [Explanation about endpoint changes in endpoint]\n\n\n   \
        \     Description of endpoint:\n        Blocking one/multi actor by admin.\n\
        \n        -block_term_type: Hour/Day\n        -block_term_amount: must more\
        \ than 1 (1 hour is short, 24 hour is medium, 1 day is medium)\n        \n\
        \n        *Note:\n        all BLOCK_TYPE in project:\n        Temporary:\n\
        \        از ۳۰ ثانیه تا ۱ ساعت (۱ ساعت هم کوتاه مدت محسوب می شود)\n      \
        \  (1, \"Short\"),\n        بیش از ۱ ساعت و تا ۲۴ ساعت (۲۴ ساعت هم میان مدت\
        \ محسوب می شود)\n        (2, \"Medium\"),\n        بیش از ۲۴ ساعت ولی متناهی\
        \ (دائم نیست - میتواند به صورت ساعت یا روز توسط راهبر تایپ شود)\n        (3,\
        \ \"Long\"),\n        Permanent:\n        بازه زمانی ندارد و به صورت دائم\
        \ مسدود/محدود میشود\n        (4, \"Permanent\")\n        \n        in this\
        \ api use Temporary(Medium/Long) / Permanent for Block,\n        Temporary\
        \ need block_term_amount and block_term_type value for calculate start and\
        \ end time in backend\n\n\n        Note:\n        -modify field block_status\
        \ in Actor_Ms/Admin_Ms by grpc\n        -After the admin blocks an actor,\
        \ the actor is automatically logged out of all their active sessions.\n  \
        \      -If subscription plan purchases are added to the project in future\
        \ versions, blocking and unblocking items\n         should also be applied\
        \ to users' subscription plans.\n        \n        - for display User/University/Industry/Business\
        \ list use api from Actor_MS:\n          http://dev.stella.webpanel.systems:3008/profiles/actor_search\n\
        \          \n        - for display Admin list use api from Admin_MS\n    \
        \    \n\n        "
      summary: Blocking actors by admin
      parameters:
      - in: query
        name: actor_type
        schema:
          type: string
          enum:
          - Admin
          - Business
          - Industry
          - University
          - User
        required: true
      - in: query
        name: block_type
        schema:
          type: string
          enum:
          - Permanent
          - Temporary
        required: true
      tags:
      - 'Admin: Block Actor - Code:Aut-7'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetInfoBlockActorRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetInfoBlockActorRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GetInfoBlockActorRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
              examples:
                BlockActorsExample:
                  value:
                    data: null
                    message: The actors was successfully blocked.
                    status_code: 201
                    errors: {}
                    success: true
                  summary: Block Actors Example
          description: Block Actors response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
              examples:
                BadRequestExample:
                  value:
                    data: null
                    message: null
                    status_code: 400
                    errors:
                      name: string
                    success: false
                  summary: Bad request example
          description: Bad request example
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
              examples:
                UnauthorizedExample:
                  value:
                    data: null
