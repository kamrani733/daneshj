  /auth/actor_login_by_identity_and_password:
    post:
      operationId: auth_actor_login_by_identity_and_password_create
      description: "\n        Last Version Update: 6.0.1\n\n\n        SRS Codes:\n\
        \        ورود با رمز عبور \n        ASR-Aut-1N4\n        USR-Aut-1N4\n\n\n\
        \        Change Log: \n        [Explanation about endpoint changes in endpoint]\n\
        \        \n- **add login_type to response for session_info**\n\n\n       \
        \ -------------------------------------------------------------------------------------------------------------\n\
        \n\n        Description of endpoint:\n        Get identity and password and\
        \ authenticate user then return tokens and session key.\n        login with\
        \ identity and password --> for all actor_type except Admin.\n\n        -\
        \ actor_type: [(1, 'User'), (2, 'Admin'), (3, 'Organiser'), (4, 'University'),\
        \ (5, 'Industry'), (6, 'Business'), (9, 'Individual')]\n        - identity:\
        \ username/email/mobile for all actor_type, except Admin.\n        - password:\
        \ password for login\n        - recaptcha_response: reCAPTCHA response for\
        \ \"I'm not a robot\".\n        \n        Note:\n        - If the session_key\
        \ is not created, we do not need to refresh_token in the response. \n    \
        \      And the expiration date of this token is shorter than the expiration\
        \ date of the standard token. \n        - use this link for test captcha:\n\
        \          http://dev.stella.webpanel.systems:3009/app_test_front/test_recaptcha/\n\
        \n        user_agent for test mobile/desktop in postman:\n        \"user_agent\"\
        : \"Mozilla/5.0 (iPhone; CPU iPhone OS 15_0 like Mac OS X) AppleWebKit/537.36\
        \ (KHTML, like Gecko) Version/15.0 Mobile/15E14 Safari/537.36\"\n        \"\
        user_agent\": \"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36\
        \ (KHTML, like Gecko) Chrome/119.0.0.0 Safari/537.36\"\n\n        "
      summary: Login by identity and password
      parameters:
