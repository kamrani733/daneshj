  /auth/actor_track_interaction:
    post:
      operationId: auth_actor_track_interaction_create
      description: "\n        Last Version Update: 1.0.0\n\n\n        SRS Codes:\n\
        \        خروج خودکار\n        ASR-Aut-3N2\n        USR-Aut-3N2\n        Adm-Aut-3N2\n\
        \n\n        Change Log: \n        [Explanation about endpoint changes in endpoint]\n\
        \n\n        Description of endpoint:\n        for use Frontend-Polling solution.\n\
        \        Recording the last actor interaction by the front-end for use in\
        \ automatic logout.\n        Any interaction with the system, for example,\
        \ if a click is made or a new page is opened, the site is closed \n      \
        \  and reopened and logged in. In fact, every API request that has an actor\
        \ session, the request date is recorded \n        for that session. After\
        \ a month, if no API requests come from the actor, an automatic logout occurs\n\
        \        \n        Note: \n        - use celery task for check and auto logout\
        \ in:\n          AUT_AUTO_LOGOUT_TIME_SITE_USER/BUSINESS/UNIVERSITY/INDUSTRY/ADMIN_ROLE_ID\n\
        \          AUT_AUTO_LOGOUT_TIME_APP_USER/BUSINESS/UNIVERSITY/INDUSTRY\n  \
        \      - The time to record this interaction must be determined by the front-end.\
        \ \n          For example, it can do this at intervals of every 1 hour or\
        \ 12 hours...\n        - If the interval for recording this interaction is\
        \ very short (for example, every 1 minute or per event), \n          it is\
        \ better to use a WebSocket instead of an Api to reduce the load on the APIs.\n\
        \          (There are several ways to do this, as explained in the description\
        \ at the beginning of the view. \n           Our choice is method 3, given\
        \ the needs of this project.)\n\n        "
      summary: Recording the last actor interaction by the front-end for use in automatic
        logout
      parameters:
      - in: query
        name: actor_type
        schema:
          type: string
          enum:
