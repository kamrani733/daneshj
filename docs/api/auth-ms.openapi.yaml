    \ \n- `/auth/actor_toggle_two_step_login` \n- `/auth/actor_verify_code` \n\n---\n\
    \n### \U0001F4C5 Date Of Update: 1405/01/17\n**Version:** 6.0.1 \n**List of Changed\
    \ Endpoints:**  \n- `/auth/actor_verify_code` \n- `/auth/actor_verify_password`\
    \ \n- `/auth/actor_login_by_identity_and_password` \n\n---\n\n### \U0001F4C5 Date\
