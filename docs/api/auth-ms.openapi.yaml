  /auth/actor_enable_totp:
    patch:
      operationId: auth_actor_enable_totp_partial_update
      description: "\n        Last Version Update: 6.1.1\n\n\n        SRS Codes:\n\
        \        فعال کردن ورود با totp\n        ASR-Aut-11N2\n        Usr-Aut-11N2\n\
        \n        \n        فعال کردن کد دو عاملی توسط کاربر/سرویس دهنده\n\n\n   \
        \     Change Log: \n        [Explanation about endpoint changes in endpoint]\n\
        \n\n        Description of endpoint:\n        You need an endpoint to generate\
        \ the TOTP secret key and return the QR code URL for the user to scan.\n \
        \       You will need a front-end to display the QR code for users to scan.\
        \ (front can use javascript library)\n        You can display it using a library\
        \ like qrcode or directly within your application. \n        Users can scan\
        \ this QR code using an authenticator app (like Google Authenticator) to get\
        \ their TOTP token.\n\n        Call the enable-mfa endpoint to enable MFA\
        \ and retrieve the TOTP secret or QR code.\n        Call the verify-mfa api/methode\
        \ to validate the TOTP token when logging in or performing sensitive operations.\n\
        \        \n        Note: This option is enabled for the Admin from the beginning\
        \ and cannot be changed.\n        \n        NOTE:\n        -For security reasons,\
        \ the TOTP secret key and its corresponding QR code are shown only once during\
        \ the \n         initial setup. They must not be retrievable afterward to\
        \ prevent potential abuse or compromise of the \n         authentication system.\n\
        \        -If the user forgets or loses access to the TOTP setup (e.g., didn't\
        \ save the secret or scan the QR code),\n         they must first disable\
        \ TOTP and then initiate the setup process again.\n         Users are responsible\
        \ for storing the secret key or QR code securely after the first display.\n\
        \n\n        "
