  /auth/actor_send_code:
    post:
      operationId: auth_actor_send_code_create
      description: "\n        Last Version Update: 1.0.0\n\n\n        SRS Codes:\n\
        \        ثبت نام کاربر\n        USR-Aut-1N1\n        ثبت نام سرویس دهنده\n\
        \        ASR-Aut-1N12\n        ورود با کد یک بار مصرف یک مرحله ای\n      \
        \  ASR-Aut-1N3\n        USR-Aut-1N3\n        ورود با کد یک بار مصرف دو مرحله\
        \ ای\n        ASR-Aut-1N5\n        USR-Aut-1N5\n        ورود راهبر \n    \
        \    Adm -Aut-1N6\n        فراموشی رمز عبور\n        Usr-Aut-4N1\n       \
        \ Asr-Aut-4N1\n        Adm-Aut-4N1\n        \n\n        Change Log:\n    \
        \    [Explanation about endpoint changes in endpoint] \n        \n- **in response\
        \ field redirect_code_type change MFA to TOTP**\n- **add remain otp code in\
        \ message as error**\n\n\n        ---------------------------------------------------------------------------------------------------------------\n\
        \n\n        Description of endpoint:\n        Get identity in a post request\
        \ and send OTP code with email/sms to the actor.\n        Get identity in\
        \ a post request, then get TOTP code with google authenticator app by the\
        \ actor.\n        \n        Send OTP in Register --> for all actor_type except\
        \ Admin.\n        Send OTP in Login --> for all actor_type.\n        redirect\
        \ to input TOTP in Login by actor --> for all actor_type.\n        Send OTP\
        \ in ResetPassword --> for all actor_type.\n\n        - actor_type: [(1, 'User'),\
        \ (2, 'Admin'), (3, 'Organiser'), (4, 'University'), (5, 'Industry'), (6,\
        \ 'Business'), (9, 'Individual')]\n        - Mobile valid formats: ['09XXXXXXXXX',\
        \ '9XXXXXXXXX', '+989XXXXXXXXX', '989XXXXXXXXX']\n        - identity: email/mobile/username\
        \ for all actor_type\n          for reset_password identity=email/mobile\n\
        \        - referral_code: is for register by link for actor_type=User\n  \
        \      - ticket_code: validation code in ticket that sent for University/Industry/Business,\n\
        \          only use for operation=Register.\n          \n        - login_identity_type:\
        \ is email/mobile/username that get in verify_code api from identity_info\
        \ dict, \n          only for operation=ResetPassword.\n          Actor enters\
        \ his mobile/email.\n          If he entered a mobile during the login stage,\
        \ he must enter an email address.\n          If he has entered email during\
        \ the login stage, he must enter mobile this time.\n          If the username\
        \ is entered during the login stage, the mobile or email does not matter.\n\
        \        - page_type: if actor use reset_pass in two_step_login page, need\
        \ login_identity_type.\n          if actor use reset_pass in login_by_username\
        \ page, no need login_identity_type.\n\n\n        Note: \n        - admin\
        \ must create in Admin_MS and set by grpc in Aut_MS db. for test create manual\
        \ admin in db.\n        - If the identity is an email, it is first normalized\
        \ and then stored in the database. \n          The same normalized email will\
        \ be displayed in the profile.\n\n        Note Postman:\n        If the identity\
        \ is an email,In URLs, + is treated as a space.Use %2B to represent a literal\
        \ plus sign in a URL.\n        ex.am.ple+test@googlemail.com == ex.am.ple%2Btest@googlemail.com\n\
        \        \n        Note:\n        The SRS states: 'After the desired time\
        \ has elapsed, it should be possible to resend the one-time password'.\n \
        \       For this case, the frontend can reuse the same endpoint(send_code).\n\
        \        \n        "
      summary: Send Code for step_1 register/login/reset_pass
      parameters:
      - in: query
        name: actor_type
        schema:
          type: string
          enum:
          - Admin
          - Business
          - Industry
          - University
          - User
        required: true
      - in: query
        name: login_identity_type
        schema:
          type: string
          enum:
          - email
          - mobile
          - username
        description: only for operation=ResetPassword
      - in: query
        name: operation
        schema:
          type: string
          enum:
          - LOGIN
          - REGISTER
          - RESET_PASSWORD
        description: for login/register User select LOGIN
        required: true
      - in: query
        name: page_type
        schema:
          type: string
          enum:
          - login_by_username
          - two_step_login
        description: only for operation=ResetPassword
      tags:
      - 'NoAuth: Send/Verify Code - Code:[Aut-1, Aut-4]'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendCodeRequest'
        required: true
      security: null
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendCodeResponse'
              examples:
                SendOTPCodeByEmailExample:
                  value:
                    data:
                      identity_type: email
                      mobile: null
                      email: zahra@gmail.com
                      redirect_code_type: OTP
                      code: '703595'
                      operation: REGISTER
                    message: OTP code has been sent for zahra@gmail.com .
                    status_code: 200
                    errors: {}
                    success: true
                  summary: Send OTP Code by Email Example
                SendOTPCodeByMobileExample:
                  value:
                    data:
                      identity_type: mobile
                      mobile: null
                      email: 09170000000
                      redirect_code_type: OTP
                      code: '703595'
                      operation: LOGIN
                    message: OTP code has been sent for 09170000000 .
                    status_code: 200
                    errors: {}
                    success: true
                  summary: Send OTP Code by Mobile Example
                SendOTPCodeByUsernameExample:
                  value:
                    data:
                      identity_type: username
                      mobile: null
                      email: Usr_zahra
                      redirect_code_type: OTP
                      code: '703595'
                      operation: LOGIN
                    message: OTP code has been sent for zahra@gmail.com/09170000000
                      .
                    status_code: 200
                    errors: {}
                    success: true
                  summary: Send OTP Code by Username Example
                EnterTOTPCodeByEmailExample:
                  value:
                    data:
                      identity_type: email
                      mobile: null
                      email: zahra@gmail.com
                      redirect_code_type: TOTP
                      operation: LOGIN
                    message: Please enter TOTP code.
                    status_code: 200
                    errors: {}
                    success: true
                  summary: Enter TOTP Code by Email Example
          description: Send/Enter OTP/TOTP code response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
              examples:
                BadRequestExample:
                  value:
                    data: null
                    message: null
                    status_code: 400
                    errors:
                      name: string
                    success: false
                  summary: Bad request example
          description: Bad request example
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
              examples:
                TooManyRequestsExample:
                  value:
                    data: null
                    message: string
                    status_code: 429
                    errors: {}
                    success: false
                  summary: Too Many Requests Example
          description: Too many requests
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BaseResponse'
              examples:
                InternalServerErrorExample:
                  value:
                    data: null
                    message: Internal server error
                    status_code: 500
                    errors: {}
                    success: false
                  summary: Internal Server Error Example
          description: Internal server error response body
