    **Version:** 6.3.1 \n**List of New Endpoints:**  \n- `/auth/report_delete_account_to_admin`\
    \ \n- `/auth/report_delete_account_to_owner_actor` \n\n---\n\n### \U0001F4C5 Date\
    \ Of Update: 1405/02/01\n**Version:** 6.2.1 \n**List of New Endpoints:**  \n-\
    \ `/auth/actor_change_password` \n- `/auth/actor_change_identity_field` \n- `/auth/display_current_security_setting`\
