  /auth/actor_verify_code:
    post:
      operationId: auth_actor_verify_code_create
      description: "\n        Last Version Update: 6.0.1\n\n\n        SRS Codes:\n\
        \        ثبت نام کاربر\n        USR-Aut-1N1\n        ثبت نام سرویس دهنده\n\
        \        ASR-Aut-1N12\n        ورود با کد یک بار مصرف یک مرحله ای\n      \
        \  ASR-Aut-1N3\n        USR-Aut-1N3\n        ورود با کد یک بار مصرف دو مرحله\
        \ ای\n        ASR-Aut-1N5\n        USR-Aut-1N5\n        ورود راهبر \n    \
        \    Adm -Aut-1N6\n        فراموشی نام كاربري / رمز عبور\n        Usr-Aut-4N1\n\
        \        Asr-Aut-4N1\n        Adm-Aut-4N1\n\n\n        Change Log: \n    \
        \    [Explanation about endpoint changes in endpoint]\n        \n- **add login_type\
        \ to response for session_info**\n\n\n        -------------------------------------------------------------------------------------------------------------\n\
        \n\n\n        Description of endpoint:\n        Get identity and OTP/TOTP\
        \ code in a post request and check if the OTP/TOTP code is verified.\n   \
        \     If the code is verified the return tokens and session key(for register/login):\n\
        \        Verify OTP in Register --> for all actor_type except Admin.\n   \
        \     Verify OTP/TOTP in Login --> for all actor_type.\n        Verify OTP\
        \ ResetPassword --> for all actor_type.\n\n        - actor_type: [(1, 'User'),\
        \ (2, 'Admin'), (3, 'Organiser'), (4, 'University'), (5, 'Industry'), (6,\
        \ 'Business'), (9, 'Individual')]\n        - identity: get from send_code\
        \ api\n        - code: Received otp/totp code\n        - Mobile valid formats:\
        \ ['09XXXXXXXXX', '9XXXXXXXXX', '+989XXXXXXXXX', '989XXXXXXXXX']\n       \
        \ - operation: get from send_code api\n\n        Note:\n        - If the identity\
        \ is an email, it is first normalized and then stored in the database. \n\
        \          The same normalized email will be displayed in the profile.\n \
        \       - If the session_key is not created, we do not need to refresh_token\
        \ in the response. \n          And the expiration date of this token is shorter\
        \ than the expiration date of the standard token. \n\n        Note Postman:\n\
        \        If the identity is an email,In URLs, + is treated as a space.Use\
        \ %2B to represent a literal plus sign in a URL.\n        ex.am.ple+test@googlemail.com\
        \ == ex.am.ple%2Btest@googlemail.com\n        \n        user_agent for test\
        \ mobile/desktop in postman:\n        \"user_agent\": \"Mozilla/5.0 (iPhone;\
        \ CPU iPhone OS 15_0 like Mac OS X) AppleWebKit/537.36 (KHTML, like Gecko)\
        \ Version/15.0 Mobile/15E14 Safari/537.36\"\n        \"user_agent\": \"Mozilla/5.0\
        \ (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/119.0.0.0\
        \ Safari/537.36\"\n\n        "
      summary: Verify Code for step_2 register/login/reset_pass
      parameters:
      - in: query
        name: actor_type
        schema:
          type: string
          enum:
          - Admin
          - Business
          - Industry
          - University
          - User
        required: true
      - in: query
        name: code_type
        schema:
          type: string
          enum:
          - OTP
          - TOTP
        description: TOTP only used for LOGIN
        required: true
      - in: query
        name: login_source
        schema:
          type: string
          enum:
          - MobileApp
          - Web
        required: true
      - in: query
        name: operation
        schema:
          type: string
          enum:
          - LOGIN
          - REGISTER
          - RESET_PASSWORD
        required: true
      tags:
      - 'NoAuth: Send/Verify Code - Code:[Aut-1, Aut-4]'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequest'
        required: true
      security: null
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyCodeResponse'
              examples:
                VerifyCodeForRegisterExample:
                  value:
                    data:
                      access_token: eyJhbGciOiJSUzIQp7HVPm8FVZnwE.....6qUIBpIRZvg1vJ0a_fMFFf_mkii2QmPgav-cP1RzNu-stOiXdDnVFKNsQjo
