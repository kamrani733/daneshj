        \ با رمز عبور یک مرحله ای\n        ASR-Aut-1N4\n        USR-Aut-1N4\n\n\n\
        \        Change Log:\n        [Explanation about endpoint changes in endpoint]\
        \ \n        \n- **Remove token for run API**\n- **in response field token_id\
        \ is deleted**\n\n\n        ---------------------------------------------------------------------------------------------------------------\n\
        \        \n        Description of endpoint:\n        Refresh Token for stay\
        \ login for all actor type\n        \n        - session_key: A key of generated\
        \ session after login. is current session\n        \n        \n        Note:\n\
        \        -The Access Token has a limited lifetime (e.g. 45 minutes).\n   \
        \     -The Refresh Token is a longer-term token that can be used to obtain\
        \ a new Access Token, without the user \n         having to re-authenticate.\n\
        \        -When the Access Token expires, the client uses the Refresh Token\
        \ to obtain a new Access Token.\n        -This method is more secure and is\
        \ used in many modern authentication systems such as \n         Google OAuth2,\
        \ Auth0, and AWS Cognito.\n         \n        -In the refresh_token endpoint,\
        \ the Access Token cannot usually be used to extract the user_id, \n     \
        \    as the token has expired. The best way to get the user_id is to use a\
        \ Refresh Token or store \n         the associated information on the server.\n\
        \        -In many OAuth2 implementations, the Refresh Token is a JWT (JSON\
        \ Web Token). If the token is in JWT format, \n         user information (such\
        \ as the user_id) can be extracted from it.\n        -Decode it and get the\
        \ value of sub (Subject) as user_id.\n\n        "
